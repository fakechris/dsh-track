# The dsh-involute bundle patch: mounts the Involute Bridge engine.
#
# Install into a profile with:
#   dsh plugin --profile web add github:dsh-external/dsh-involute
#
# The web-app bundle already mounts storage (json backend under ~/.dsh/storages),
# storage-domain, skill, and skill-local — this patch only inserts the involute
# engine row. The fat skill ships in skills/dsh-involute/SKILL.md and is copied
# to ~/.dsh/skills/dsh-involute by the install script so skill-local's default
# roots pick it up.

- insert:
    - id: involute
      name: '@deepseek-ai/dsh-involute'
